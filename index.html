<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Duck Dash Online</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-yellow: #fdf500;
            --dark-bg: #050505;
            --panel-bg: rgba(10, 10, 15, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--neon-blue);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(0, 243, 255, 0.2);
            pointer-events: auto;
            max-width: 90%;
            width: 400px;
        }

        h1, h2, h3 {
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            font-size: 2.5rem;
        }

        h2 {
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue), 0 0 10px var(--neon-blue);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            border-radius: 5px;
            outline: none;
            text-align: center;
        }

        input:focus {
            box-shadow: 0 0 10px var(--neon-blue);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }

        button:hover, button:active {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
        }

        .btn-blue {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .btn-blue:hover, .btn-blue:active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue);
        }

        .hidden {
            display: none !important;
        }

        #players-list {
            list-style: none;
            margin-bottom: 20px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }

        #players-list li {
            padding: 8px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            display: flex;
            justify-content: space-between;
        }

        .ready-text { color: var(--neon-yellow); }
        .host-text { color: var(--neon-pink); font-size: 0.8rem; }

        /* Game HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            display: none;
            padding: 20px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        #timer {
            font-size: 2rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        #leaderboard {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--neon-blue);
            border-radius: 10px;
            padding: 10px;
            min-width: 150px;
        }

        #leaderboard h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--neon-blue);
        }

        #leaderboard-list {
            list-style: none;
            font-size: 0.9rem;
        }

        #event-banner {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            color: var(--neon-pink);
            text-shadow: 0 0 20px var(--neon-pink);
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* Virtual Joystick */
        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid rgba(0, 243, 255, 0.3);
            pointer-events: auto;
            display: none;
        }

        #joystick-knob {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            pointer-events: none;
        }

        #connection-status {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 0.8rem;
            color: var(--neon-blue);
        }

        .pulse {
            animation: pulse-anim 2s infinite;
        }

        @keyframes pulse-anim {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #error-msg {
            color: #ff3333;
            margin-top: 10px;
            font-size: 0.9rem;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

    <!-- UI Layer -->
    <div class="ui-layer" id="ui-layer">
        
        <!-- Main Menu -->
        <div class="panel" id="main-menu">
            <h1>Neon Duck Dash</h1>
            <p style="margin-bottom: 20px; color: var(--neon-yellow);">Multiplayer Cyber-Pond</p>
            <input type="text" id="player-name" placeholder="Enter Your Duck Name" maxlength="15">
            <button id="btn-create-room">Create Room</button>
            <div style="margin: 15px 0;">-- OR --</div>
            <input type="text" id="room-code-input" placeholder="Enter Room Code" maxlength="6" style="text-transform: uppercase;">
            <button class="btn-blue" id="btn-join-room">Join Room</button>
            <div id="error-msg"></div>
        </div>

        <!-- Lobby Menu -->
        <div class="panel hidden" id="lobby-menu">
            <h2>Waiting Room</h2>
            <p>Room Code: <strong id="display-room-code" style="color: var(--neon-yellow); font-size: 1.5rem; letter-spacing: 3px;"></strong></p>
            <button class="btn-blue" id="btn-copy-code" style="padding: 10px; font-size: 0.9rem; margin-top: 10px;">Copy Code</button>
            
            <h3 style="margin-top: 20px; font-size: 1.2rem;">Connected Ducks</h3>
            <ul id="players-list">
                <!-- Players will populate here -->
            </ul>

            <button id="btn-start-match" class="hidden pulse">Start Match</button>
            <button class="btn-blue" id="btn-ready">Toggle Ready</button>
            <button class="btn-blue" id="btn-leave-room" style="margin-top: 10px; font-size: 0.9rem; border-color: #555; color: #aaa;">Leave Room</button>
        </div>

        <!-- Victory Screen -->
        <div class="panel hidden" id="victory-screen">
            <h1>Match Over!</h1>
            <h2 id="winner-name" style="color: var(--neon-yellow); font-size: 2rem;"></h2>
            <p style="margin-bottom: 20px;">Won the cyber pond!</p>
            <ul id="final-scores" style="list-style: none; margin-bottom: 20px; text-align: left;"></ul>
            <button id="btn-back-to-lobby">Back to Lobby</button>
        </div>

    </div>

    <!-- Game HUD -->
    <div id="hud">
        <div class="hud-top">
            <div id="leaderboard">
                <h3>Scores</h3>
                <ul id="leaderboard-list"></ul>
            </div>
            <div id="timer">3:00</div>
        </div>
        <div id="event-banner">Event Name!</div>
    </div>

    <!-- Virtual Joystick -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="connection-status">Connecting...</div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Firebase Imports & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, onDisconnect, get, child, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Firebase Configuration (Provided by User)
        const firebaseConfig = {
            apiKey: "AIzaSyB_cZ3djaTfYbwanJ_XA62HeDs8MkTm0iA",
            authDomain: "multi-online-game.firebaseapp.com",
            databaseURL: "https://multi-online-game-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "multi-online-game",
            storageBucket: "multi-online-game.firebasestorage.app",
            messagingSenderId: "654755025514",
            appId: "1:654755025514:web:b09bc4fbe88e48e3e4b013",
            measurementId: "G-V8HE26C2KK"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Audio System (Web Audio API) ---
        let audioCtx;
        let isAudioInit = false;

        function initAudio() {
            if (isAudioInit) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                isAudioInit = true;
                startBGM();
            } catch (e) {
                console.warn("Web Audio API not supported");
            }
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function sfxCollect() { playTone(880, 'sine', 0.1, 0.2); setTimeout(() => playTone(1200, 'sine', 0.15, 0.2), 100); }
        function sfxJump() { playTone(300, 'square', 0.2, 0.1); }
        function sfxEvent() { playTone(150, 'sawtooth', 1.0, 0.3); setTimeout(() => playTone(100, 'sawtooth', 1.5, 0.3), 200); }
        
        let bgmInterval;
        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            let noteIdx = 0;
            const notes = [220, 220, 330, 220, 440, 330, 220, 164];
            bgmInterval = setInterval(() => {
                if (gameState === 'playing' && audioCtx) {
                    playTone(notes[noteIdx % notes.length], 'square', 0.15, 0.05);
                    noteIdx++;
                }
            }, 250);
        }

        // --- State Variables ---
        let myId = "duck_" + Math.random().toString(36).substr(2, 9);
        let myName = "";
        let currentRoom = null;
        let isHost = false;
        let gameState = 'menu'; // menu, lobby, playing, gameover
        let roomRef = null;
        let myPlayerRef = null;
        let players = {};
        let batteries = {};
        let currentEvent = 'normal';
        let matchEndTime = 0;

        const neonColors = ['#00f3ff', '#ff00ff', '#fdf500', '#00ff00', '#ff5500'];
        let myColor = neonColors[Math.floor(Math.random() * neonColors.length)];

        // --- DOM Elements ---
        const uiLayer = document.getElementById('ui-layer');
        const mainMenu = document.getElementById('main-menu');
        const lobbyMenu = document.getElementById('lobby-menu');
        const victoryScreen = document.getElementById('victory-screen');
        const hud = document.getElementById('hud');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const errorMsg = document.getElementById('error-msg');
        const displayRoomCode = document.getElementById('display-room-code');
        const playersList = document.getElementById('players-list');
        const btnStartMatch = document.getElementById('btn-start-match');
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        const eventBanner = document.getElementById('event-banner');

        // --- Network Logic ---
        const connectionRef = ref(db, '.info/connected');
        onValue(connectionRef, (snap) => {
            document.getElementById('connection-status').innerText = snap.val() ? "Connected" : "Disconnected";
            document.getElementById('connection-status').style.color = snap.val() ? "var(--neon-blue)" : "#ff3333";
        });

        function showError(msg) {
            errorMsg.innerText = msg;
            setTimeout(() => errorMsg.innerText = "", 3000);
        }

        function generateRoomCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        document.getElementById('btn-create-room').addEventListener('click', () => {
            initAudio();
            myName = document.getElementById('player-name').value.trim() || "NeonDuck";
            currentRoom = generateRoomCode();
            isHost = true;
            joinRoomLogic(currentRoom, true);
        });

        document.getElementById('btn-join-room').addEventListener('click', () => {
            initAudio();
            myName = document.getElementById('player-name').value.trim() || "NeonDuck";
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if (code.length === 6) {
                // Check if room exists
                get(child(ref(db), `rooms/${code}`)).then((snapshot) => {
                    if (snapshot.exists() && snapshot.val().state !== 'playing') {
                        currentRoom = code;
                        isHost = false;
                        joinRoomLogic(currentRoom, false);
                    } else {
                        showError("Room not found or game already started!");
                    }
                });
            } else {
                showError("Invalid room code!");
            }
        });

        function joinRoomLogic(roomId, creating) {
            roomRef = ref(db, `rooms/${roomId}`);
            myPlayerRef = ref(db, `rooms/${roomId}/players/${myId}`);

            if (creating) {
                set(roomRef, {
                    state: 'lobby',
                    host: myId,
                    currentEvent: 'normal',
                    matchEndTime: 0
                });
            }

            // Set my player data
            set(myPlayerRef, {
                name: myName,
                ready: isHost, // Host is always ready
                color: myColor,
                x: Math.random() * 800,
                y: Math.random() * 600,
                score: 0,
                size: 1
            });

            // Cleanup on disconnect
            onDisconnect(myPlayerRef).remove();

            // Switch UI
            mainMenu.classList.add('hidden');
            lobbyMenu.classList.remove('hidden');
            displayRoomCode.innerText = roomId;
            if (isHost) btnStartMatch.classList.remove('hidden');

            gameState = 'lobby';
            setupRoomListeners();
        }

        document.getElementById('btn-copy-code').addEventListener('click', () => {
            const textarea = document.createElement("textarea");
            textarea.value = currentRoom;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand("copy");
                document.getElementById('btn-copy-code').innerText = "Copied!";
                setTimeout(() => document.getElementById('btn-copy-code').innerText = "Copy Code", 2000);
            } catch (err) {
                showError("Failed to copy");
            }
            document.body.removeChild(textarea);
        });

        document.getElementById('btn-leave-room').addEventListener('click', leaveRoom);

        function leaveRoom() {
            if (myPlayerRef) remove(myPlayerRef);
            if (roomRef) offRoomListeners();
            gameState = 'menu';
            currentRoom = null;
            isHost = false;
            lobbyMenu.classList.add('hidden');
            victoryScreen.classList.add('hidden');
            hud.style.display = 'none';
            canvas.style.display = 'none';
            uiLayer.style.display = 'flex';
            mainMenu.classList.remove('hidden');
            joystickZone.style.display = 'none';
            players = {};
        }

        document.getElementById('btn-ready').addEventListener('click', () => {
            if (!isHost && myPlayerRef && players[myId]) {
                update(myPlayerRef, { ready: !players[myId].ready });
            }
        });

        document.getElementById('btn-start-match').addEventListener('click', () => {
            if (isHost && roomRef) {
                const allReady = Object.values(players).every(p => p.ready);
                if (allReady || Object.keys(players).length === 1) {
                    const endTime = Date.now() + (3 * 60 * 1000); // 3 minutes
                    update(roomRef, { 
                        state: 'playing',
                        matchEndTime: endTime,
                        currentEvent: 'normal'
                    });
                    generateInitialBatteries();
                } else {
                    showError("Not all players are ready!");
                }
            }
        });

        document.getElementById('btn-back-to-lobby').addEventListener('click', () => {
            if (isHost && roomRef) {
                update(roomRef, { state: 'lobby' });
            }
            victoryScreen.classList.add('hidden');
            lobbyMenu.classList.remove('hidden');
            gameState = 'lobby';
        });

        let unsubRoom = null;
        let unsubPlayers = null;
        let unsubBatteries = null;

        function offRoomListeners() {
            // In a real app we'd use the unsub functions returned by onValue, 
            // but for simplicity in this single file we'll just re-assign or let it drop.
        }

        function setupRoomListeners() {
            onValue(ref(db, `rooms/${currentRoom}/state`), (snap) => {
                const state = snap.val();
                if (!state) { leaveRoom(); return; } // Room closed

                if (state === 'playing' && gameState !== 'playing') {
                    startGame();
                } else if (state === 'finished' && gameState !== 'gameover') {
                    endGame();
                } else if (state === 'lobby' && gameState !== 'lobby') {
                    resetToLobby();
                }
            });

            onValue(ref(db, `rooms/${currentRoom}/players`), (snap) => {
                players = snap.val() || {};
                updateLobbyUI();
                updateLeaderboard();
            });

            onValue(ref(db, `rooms/${currentRoom}/batteries`), (snap) => {
                batteries = snap.val() || {};
            });

            onValue(ref(db, `rooms/${currentRoom}/currentEvent`), (snap) => {
                const newEvent = snap.val() || 'normal';
                if (newEvent !== currentEvent && newEvent !== 'normal') {
                    showEventBanner(newEvent);
                }
                currentEvent = newEvent;
            });

            onValue(ref(db, `rooms/${currentRoom}/matchEndTime`), (snap) => {
                matchEndTime = snap.val() || 0;
            });
        }

        function updateLobbyUI() {
            if (gameState !== 'lobby') return;
            playersList.innerHTML = '';
            for (let id in players) {
                const p = players[id];
                const li = document.createElement('li');
                const isHostStr = (id === currentRoom.host) ? '<span class="host-text">(HOST)</span>' : '';
                const readyStr = p.ready ? '<span class="ready-text">READY</span>' : '<span style="color:#666">WAITING</span>';
                li.innerHTML = `<span><span style="color:${p.color}">●</span> ${p.name} ${isHostStr}</span> ${readyStr}`;
                playersList.appendChild(li);
            }
        }

        function updateLeaderboard() {
            if (gameState !== 'playing' && gameState !== 'gameover') return;
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            const sorted = Object.values(players).sort((a, b) => b.score - a.score);
            sorted.forEach(p => {
                const li = document.createElement('li');
                li.innerHTML = `<span style="color:${p.color}">${p.name}</span>: ${p.score}`;
                list.appendChild(li);
            });
        }

        function showEventBanner(evt) {
            sfxEvent();
            let text = "";
            switch(evt) {
                case 'giant_duck': text = "GIANT DUCK INBOUND!"; break;
                case 'low_gravity': text = "LOW GRAVITY!"; break;
                case 'oversized': text = "CHONKY DUCKS!"; break;
                case 'flicker': text = "POWER MALFUNCTION!"; break;
            }
            eventBanner.innerText = text;
            eventBanner.style.opacity = 1;
            setTimeout(() => { eventBanner.style.opacity = 0; }, 3000);
        }

        // --- Game Engine ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let myDuck = { x: 400, y: 300, vx: 0, vy: 0, score: 0 };
        const keys = { w: false, a: false, s: false, d: false, ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false };
        
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Touch Joystick Logic
        let joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0 };
        
        if ('ontouchstart' in window) {
            joystickZone.style.display = 'block';
            joystickZone.addEventListener('touchstart', handleTouchStart, {passive: false});
            joystickZone.addEventListener('touchmove', handleTouchMove, {passive: false});
            joystickZone.addEventListener('touchend', handleTouchEnd);
        }

        function handleTouchStart(e) {
            e.preventDefault();
            joystick.active = true;
            const rect = joystickZone.getBoundingClientRect();
            joystick.originX = rect.left + rect.width / 2;
            joystick.originY = rect.top + rect.height / 2;
            updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!joystick.active) return;
            updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            joystick.active = false;
            joystick.dx = 0;
            joystick.dy = 0;
            joystickKnob.style.transform = `translate(0px, 0px)`;
        }

        function updateJoystick(clientX, clientY) {
            let dx = clientX - joystick.originX;
            let dy = clientY - joystick.originY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 50;
            
            if (distance > maxDist) {
                dx = (dx / distance) * maxDist;
                dy = (dy / distance) * maxDist;
            }
            
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            
            // Normalize for movement (-1 to 1)
            joystick.dx = dx / maxDist;
            joystick.dy = dy / maxDist;
        }

        function startGame() {
            gameState = 'playing';
            uiLayer.style.display = 'none';
            canvas.style.display = 'block';
            hud.style.display = 'block';
            myDuck.x = Math.random() * (canvas.width - 100) + 50;
            myDuck.y = Math.random() * (canvas.height - 100) + 50;
            myDuck.vx = 0;
            myDuck.vy = 0;
            myDuck.score = 0;
            
            if (myPlayerRef) {
                update(myPlayerRef, { x: myDuck.x, y: myDuck.y, score: 0 });
            }
            
            requestAnimationFrame(gameLoop);
            if(isHost) hostLoop();
        }

        function resetToLobby() {
            gameState = 'lobby';
            canvas.style.display = 'none';
            hud.style.display = 'none';
            victoryScreen.classList.add('hidden');
            lobbyMenu.classList.remove('hidden');
            uiLayer.style.display = 'flex';
        }

        function endGame() {
            gameState = 'gameover';
            canvas.style.display = 'none';
            hud.style.display = 'none';
            uiLayer.style.display = 'flex';
            victoryScreen.classList.remove('hidden');
            
            const sorted = Object.values(players).sort((a, b) => b.score - a.score);
            if (sorted.length > 0) {
                document.getElementById('winner-name').innerText = sorted[0].name;
            }
            
            const finalScores = document.getElementById('final-scores');
            finalScores.innerHTML = '';
            sorted.forEach(p => {
                const li = document.createElement('li');
                li.innerHTML = `<span style="color:${p.color}">${p.name}</span>: ${p.score} batteries`;
                finalScores.appendChild(li);
            });
        }

        // Host specific logic
        let hostEventTimer = 0;
        function hostLoop() {
            if (gameState !== 'playing' || !isHost) return;

            // Timer check
            if (Date.now() >= matchEndTime) {
                update(roomRef, { state: 'finished' });
                return;
            }

            // Manage batteries
            if (Object.keys(batteries).length < 5) {
                generateInitialBatteries(1);
            }

            // Random Events
            hostEventTimer++;
            if (hostEventTimer > 600) { // Approx every 10 seconds check
                hostEventTimer = 0;
                if (Math.random() > 0.6) {
                    const events = ['giant_duck', 'low_gravity', 'oversized', 'flicker'];
                    const evt = events[Math.floor(Math.random() * events.length)];
                    update(roomRef, { currentEvent: evt });
                    
                    // Reset event after 5 seconds
                    setTimeout(() => {
                        if (gameState === 'playing') update(roomRef, { currentEvent: 'normal' });
                    }, 5000);
                }
            }

            setTimeout(hostLoop, 1000/60);
        }

        function generateInitialBatteries(count = 5) {
            for(let i=0; i<count; i++) {
                const bId = "bat_" + Math.random().toString(36).substr(2, 9);
                set(ref(db, `rooms/${currentRoom}/batteries/${bId}`), {
                    x: Math.random() * (canvas.width - 60) + 30,
                    y: Math.random() * (canvas.height - 60) + 30
                });
            }
        }

        // Main Game Loop
        let lastSync = 0;
        let giantDuckNPC = { x: 0, y: 0, vx: 5, vy: 5 };

        function gameLoop() {
            if (gameState !== 'playing') return;

            updatePhysics();
            checkCollisions();
            render();

            // Sync to network at 20fps
            const now = Date.now();
            if (now - lastSync > 50) {
                if (myPlayerRef) {
                    update(myPlayerRef, { x: myDuck.x, y: myDuck.y });
                }
                lastSync = now;
            }

            // Update UI timer
            const timeLeft = Math.max(0, Math.floor((matchEndTime - Date.now()) / 1000));
            const mins = Math.floor(timeLeft / 60);
            const secs = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;

            requestAnimationFrame(gameLoop);
        }

        function updatePhysics() {
            let friction = currentEvent === 'low_gravity' ? 0.98 : 0.85;
            let accel = currentEvent === 'low_gravity' ? 0.3 : 1.2;
            let maxSpeed = currentEvent === 'low_gravity' ? 12 : 8;

            // Input
            if (keys.w || keys.ArrowUp) myDuck.vy -= accel;
            if (keys.s || keys.ArrowDown) myDuck.vy += accel;
            if (keys.a || keys.ArrowLeft) myDuck.vx -= accel;
            if (keys.d || keys.ArrowRight) myDuck.vx += accel;

            if (joystick.active) {
                myDuck.vx += joystick.dx * accel * 2;
                myDuck.vy += joystick.dy * accel * 2;
            }

            // Apply velocity
            myDuck.x += myDuck.vx;
            myDuck.y += myDuck.vy;

            // Apply friction
            myDuck.vx *= friction;
            myDuck.vy *= friction;

            // Bounds
            if (myDuck.x < 20) { myDuck.x = 20; myDuck.vx *= -1; }
            if (myDuck.x > canvas.width - 20) { myDuck.x = canvas.width - 20; myDuck.vx *= -1; }
            if (myDuck.y < 20) { myDuck.y = 20; myDuck.vy *= -1; }
            if (myDuck.y > canvas.height - 20) { myDuck.y = canvas.height - 20; myDuck.vy *= -1; }

            // NPC Logic (Deterministic based on time/bounds)
            if (currentEvent === 'giant_duck') {
                giantDuckNPC.x += giantDuckNPC.vx;
                giantDuckNPC.y += giantDuckNPC.vy;
                if (giantDuckNPC.x < 100 || giantDuckNPC.x > canvas.width - 100) giantDuckNPC.vx *= -1;
                if (giantDuckNPC.y < 100 || giantDuckNPC.y > canvas.height - 100) giantDuckNPC.vy *= -1;
                
                // Bounce player off giant duck
                const dx = myDuck.x - giantDuckNPC.x;
                const dy = myDuck.y - giantDuckNPC.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 120) {
                    myDuck.vx += (dx/dist) * 15;
                    myDuck.vy += (dy/dist) * 15;
                    sfxJump();
                }
            } else {
                giantDuckNPC.x = canvas.width/2;
                giantDuckNPC.y = canvas.height/2;
            }
        }

        function checkCollisions() {
            const size = currentEvent === 'oversized' ? 40 : 20;
            for (let bId in batteries) {
                const b = batteries[bId];
                const dx = myDuck.x - b.x;
                const dy = myDuck.y - b.y;
                if (Math.sqrt(dx*dx + dy*dy) < size + 15) {
                    // Collected!
                    sfxCollect();
                    myDuck.score++;
                    update(myPlayerRef, { score: myDuck.score });
                    remove(ref(db, `rooms/${currentRoom}/batteries/${bId}`)); // Remove battery
                }
            }
        }

        function render() {
            // Flicker effect
            if (currentEvent === 'flicker' && Math.random() > 0.7) {
                ctx.fillStyle = "rgba(17, 17, 17, 0.1)";
            } else {
                ctx.fillStyle = "rgba(5, 5, 5, 0.4)"; // Trail effect
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Batteries
            ctx.shadowBlur = 15;
            ctx.shadowColor = "var(--neon-yellow)";
            ctx.fillStyle = "var(--neon-yellow)";
            for (let bId in batteries) {
                const b = batteries[bId];
                ctx.beginPath();
                ctx.arc(b.x, b.y, 8 + Math.sin(Date.now() / 200) * 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw Giant Duck NPC
            if (currentEvent === 'giant_duck') {
                drawDuck(giantDuckNPC.x, giantDuckNPC.y, "var(--neon-yellow)", 5, false);
            }

            // Draw Players
            const baseSize = currentEvent === 'oversized' ? 2.5 : 1;
            for (let id in players) {
                const p = players[id];
                // Smooth interpolation could go here, but simple assignment for now
                let x = p.x;
                let y = p.y;
                if (id === myId) { x = myDuck.x; y = myDuck.y; } // Use local coords for self

                drawDuck(x, y, p.color, baseSize, id === myId);
                
                // Draw Name
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#fff";
                ctx.font = "12px Orbitron";
                ctx.textAlign = "center";
                ctx.fillText(p.name, x, y - (25 * baseSize));
            }
        }

        function drawDuck(x, y, color, scale, isMe) {
            ctx.save();
            ctx.translate(x, y);
            
            // Wobble effect based on movement or time
            if (isMe) {
                ctx.rotate((myDuck.vx * 0.05));
            }
            
            ctx.scale(scale, scale);
            
            ctx.shadowBlur = isMe ? 25 : 15;
            ctx.shadowColor = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            
            // Body
            ctx.beginPath();
            ctx.ellipse(0, 5, 15, 12, 0, 0, Math.PI * 2);
            ctx.stroke();
            
            // Tail
            ctx.beginPath();
            ctx.moveTo(-15, 5);
            ctx.lineTo(-25, 0);
            ctx.lineTo(-12, 12);
            ctx.stroke();

            // Head
            ctx.beginPath();
            ctx.arc(10, -5, 10, 0, Math.PI * 2);
            ctx.stroke();
            
            // Beak
            ctx.beginPath();
            ctx.moveTo(18, -5);
            ctx.lineTo(28, -2);
            ctx.lineTo(18, 2);
            ctx.stroke();
            
            // Eye
            ctx.beginPath();
            ctx.arc(12, -8, 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();

            ctx.restore();
        }

    </script>
</body>
